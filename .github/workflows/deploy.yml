name: Deploy to Cloudflare

# Pushes to main deploy production. Pull requests deploy an isolated preview:
# the `dev` worker (gbbo-api-dev, backed by the gbbo-db-dev D1 database) and a
# Pages branch preview of the frontend pointed at it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production deploy mid-migration; superseded previews can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN only needs to read the repo; Cloudflare access uses the secrets below.
permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  IS_PREVIEW: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API to Cloudflare Workers
    # Pull requests from forks don't receive secrets, so they can't deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview-api' || 'production-api' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: packages/api-workers

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check token exists
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "TOKEN IS EMPTY"
          else
            echo "Token is set (length: ${#CLOUDFLARE_API_TOKEN})"
          fi

      - name: Apply D1 migrations
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            npx wrangler d1 migrations apply gbbo-db-dev --remote --env dev
          else
            npx wrangler d1 migrations apply gbbo-db --remote
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          set -o pipefail
          if [ "$IS_PREVIEW" = "true" ]; then
            npx wrangler deploy --env dev | tee deploy.log
          else
            npx wrangler deploy | tee deploy.log
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL found in wrangler deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Cloudflare Pages
    needs: deploy-api
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        working-directory: packages/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-api.outputs.url }}

      # wrangler is installed in the api-workers workspace; it ignores that
      # package's Workers config for `pages deploy`.
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: packages/api-workers
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          npx wrangler pages deploy ../frontend/out --project-name gbbo-frontend --branch "$BRANCH" | tee deploy.log
          if [ "$IS_PREVIEW" = "true" ]; then
            # Prefer the stable per-branch alias over the per-deployment hash URL.
            url=$(grep -oE 'https://[a-z0-9.-]+\.gbbo-frontend\.pages\.dev' deploy.log | tail -1)
          else
            url=https://gbbo-frontend.pages.dev
          fi
          if [ -z "$url" ]; then
            echo "::error::No pages.dev URL found in wrangler pages deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
