name: Deploy to Cloudflare

# Every run starts with quality checks (lint, type-check, tests, build); nothing is
# migrated or deployed unless they pass. Pushes to main then deploy production. Pull
# requests deploy an isolated preview: the `dev` worker (gbbo-api-dev, backed by the
# gbbo-db-dev D1 database) and a Pages branch preview of the frontend pointed at it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production deploy mid-migration; superseded previews can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN only needs to read the repo; Cloudflare access uses the secrets below.
permissions:
  contents: read

env:
  IS_PREVIEW: ${{ github.event_name == 'pull_request' }}

jobs:
  # Needs no secrets, so it also runs for pull requests from forks.
  check:
    runs-on: ubuntu-latest
    name: Quality checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API to Cloudflare Workers
    needs: check
    # Pull requests from forks don't receive secrets, so they can't deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview-api' || 'production-api' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: packages/api-workers

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json#packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check token exists
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "TOKEN IS EMPTY"
          else
            echo "Token is set (length: ${#CLOUDFLARE_API_TOKEN})"
          fi

      - name: Apply D1 migrations
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            pnpm exec wrangler d1 migrations apply gbbo-db-dev --remote --env dev
          else
            pnpm exec wrangler d1 migrations apply gbbo-db --remote
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          set -o pipefail
          if [ "$IS_PREVIEW" = "true" ]; then
            pnpm exec wrangler deploy --env dev | tee deploy.log
          else
            pnpm exec wrangler deploy | tee deploy.log
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL found in wrangler deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Cloudflare Pages
    needs: deploy-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build
        working-directory: packages/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-api.outputs.url }}

      # wrangler is installed in the api-workers workspace; it ignores that
      # package's Workers config for `pages deploy`.
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: packages/api-workers
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          pnpm exec wrangler pages deploy ../frontend/out --project-name gbbo-frontend --branch "$BRANCH" | tee deploy.log
          if [ "$IS_PREVIEW" = "true" ]; then
            # Prefer the stable per-branch alias over the per-deployment hash URL.
            url=$(grep -oE 'https://[a-z0-9.-]+\.gbbo-frontend\.pages\.dev' deploy.log | tail -1)
          else
            url=https://gbbo-frontend.pages.dev
          fi
          if [ -z "$url" ]; then
            echo "::error::No pages.dev URL found in wrangler pages deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
